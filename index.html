<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yasin Emir KAHYA | Kişisel Blog</title>
    <meta name="description" content="Yasin Emir KAHYA'nın kişisel blogu, teknoloji haberleri ve yazılım projeleri.">
    <meta name="author" content="Yasin Emir KAHYA">

    <!-- GOOGLE İÇİN KİŞİ KARTI SCHEMA ALTYAPISI (İsmin ve Fotoğrafın İçin) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Person",
      "name": "Yasin Emir KAHYA",
      "url": "https://kullaniciadiniz.github.io",
      "image": "https://kullaniciadiniz.github.io/profil.jpg",
      "jobTitle": "Elektronik | Yazılım Geliştirici",
      "sameAs": [
        "https://github.com/yasinemirkahya1122-del",
        "https://instagram.com/yasinqq001"
      ]
    }
    </script>

    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --border-color: #30363d;
            --accent-color: #58a6ff;
            --text-main: #c9d1d9;
            --text-muted: #8b949e;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); line-height: 1.6; }

        /* Üst Header */
        header { display: flex; justify-content: space-between; align-items: center; padding: 1.2rem 2rem; background: rgba(13, 17, 23, 0.95); border-bottom: 1px solid var(--border-color); position: sticky; top: 0; z-index: 10; backdrop-filter: blur(8px); }
        .logo { font-size: 1.4rem; font-weight: 700; color: #fff; letter-spacing: 0.5px; }
        
        /* 3 Çizgi Menü */
        .menu-btn { font-size: 1.8rem; background: none; border: none; color: #fff; cursor: pointer; }

        /* Yan Açılır Menü */
        .side-nav { position: fixed; top: 0; right: -300px; width: 280px; height: 100%; background: var(--card-bg); border-left: 1px solid var(--border-color); transition: 0.3s ease; padding: 2rem 1.5rem; z-index: 20; display: flex; flex-direction: column; gap: 1.2rem; }
        .side-nav.active { right: 0; }
        .close-btn { align-self: flex-end; font-size: 1.5rem; background: none; border: none; color: var(--text-muted); cursor: pointer; }
        .side-nav a { color: var(--text-main); text-decoration: none; font-size: 1.1rem; padding: 0.6rem; border-radius: 6px; transition: 0.2s; }
        .side-nav a:hover { background: #21262d; color: var(--accent-color); }

        /* Sayfa Düzeni */
        .container { max-width: 800px; margin: 2rem auto; padding: 0 1rem; }
        .profile-section { text-align: center; margin-bottom: 3rem; padding: 2rem 1rem; border-bottom: 1px solid var(--border-color); }
        .profile-img { width: 120px; height: 120px; border-radius: 50%; object-fit: cover; border: 3px solid var(--accent-color); margin-bottom: 1rem; }
        
        /* Haber Kartı */
        .news-container { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 10px; padding: 2rem; margin-top: 1.5rem; }
        .news-title { font-size: 1.8rem; color: #fff; border-bottom: 2px solid var(--accent-color); padding-bottom: 0.5rem; margin-bottom: 1.5rem; }
        .news-item { margin-bottom: 1.5rem; padding-bottom: 1rem; border-bottom: 1px solid #21262d; }
        .news-item:last-child { border-bottom: none; }
        .news-item h3 { color: var(--accent-color); font-size: 1.2rem; margin-bottom: 0.4rem; }
        .meta-info { margin-top: 1.5rem; font-size: 0.95rem; color: var(--text-muted); border-top: 1px solid var(--border-color); padding-top: 1rem; }
        
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); display: none; z-index: 15; }
        .overlay.active { display: block; }
    </style>
</head>
<body>

    <header>
        <div class="logo">Benim Bloğum</div>
        <button class="menu-btn" onclick="toggleMenu()">☰</button>
    </header>

    <div class="overlay" id="overlay" onclick="toggleMenu()"></div>

    <nav class="side-nav" id="sideNav">
        <button class="close-btn" onclick="toggleMenu()">✕</button>
        <a href="#hakkimda">Hakkımda</a>
        <a href="#iletisim">İletişim</a>
        <a href="#teknoloji-haberleri">Teknoloji Haberleri</a>
    </nav>

    <div class="container">
        <!-- Profil & Hakkımda Alanı (Google'ın Seni Tanıması İçin Kritik) -->
        <section id="hakkimda" class="profile-section">
            <img src="profil.jpg" alt="Yasin Emir KAHYA" class="profile-img">
            <h2>Yasin Emir KAHYA</h2>
            <p style="color: var(--text-muted); margin-top: 0.5rem;">Yazılım, teknoloji ve kişisel projeler üzerine günlük notlar.</p>
        </section>

        <!-- Teknoloji Haberleri Bölümü -->
        <section id="teknoloji-haberleri">
            <div id="news-content">
                <p style="text-align: center; color: var(--text-muted);">Güncel teknoloji haberleri yükleniyor...</p>
            </div>
        </section>
        
        <section id="iletisim" style="margin-top: 4rem; text-align: center; padding: 2rem 0;">
            <h3>İletişim</h3>
            <p style="color: var(--text-muted); margin-top: 0.5rem;">Bana sosyal medya hesaplarımdan ulaşabilirsiniz.</p>
        </section>
    </div>

    <script>
        function toggleMenu() {
            document.getElementById('sideNav').classList.toggle('active');
            document.getElementById('overlay').classList.toggle('active');
        }

        async function loadNews() {
            try {
                const response = await fetch('news.json');
                const data = await response.json();
                const container = document.getElementById('news-content');
                
                let html = `<div class="news-container">
                                <h1 class="news-title">${data.title}</h1>`;
                
                data.articles.forEach((art, idx) => {
                    html += `
                        <div class="news-item">
                            <h3>${idx + 1}. ${art.headline}</h3>
                            <p>${art.content}</p>
                        </div>
                    `;
                });

                html += `
                    <div class="meta-info">
                        <p><strong>Haber Kaynağı:</strong> ${data.sources}</p>
                        <p style="margin-top: 0.3rem;"><strong>Yazar:</strong> ${data.author}</p>
                    </div>
                </div>`;

                container.innerHTML = html;
            } catch (e) {
                document.getElementById('news-content').innerHTML = "<p style='text-align:center;'>Haberler yakında eklenecek.</p>";
            }
        }

        loadNews();
    </script>
</body>
</html>
